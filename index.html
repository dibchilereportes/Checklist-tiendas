<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gestión de Tiendas — DIB / Bazhars</title>
<style>
  :root{
    --bg:#F2F1EC; --surface:#FFFFFF; --ink:#20242A; --ink-soft:#5B6169; --line:#E1DFD6;
    --teal:#28565C; --teal-deep:#183C41; --brick:#B8412E; --moss:#3E7D5A; --amber:#C08A2E;
    --muted:#9A9A8E; --radius:10px;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-display: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;
  }
  *{box-sizing:border-box;}
  html{ height:100%; -webkit-text-size-adjust:100%; }
  body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--font-body); -webkit-font-smoothing:antialiased; }
  .app{max-width:960px;margin:0 auto;padding:0 0 calc(40px + env(safe-area-inset-bottom));}
  header.top{ background:var(--teal-deep); color:#F2F1EC; padding:18px 20px 0 20px; border-bottom:4px solid var(--brick); }
  .brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .brandrow h1{ font-family:var(--font-display); font-size:19px;letter-spacing:0.2px;margin:0 0 2px 0;font-weight:700; }
  .brandrow .sub{font-size:11.5px;color:#B9C7C4;}
  .headerbtns{display:flex;gap:10px;align-items:center;}
  .gear{background:none;border:none;color:#C7D3D1;font-size:17px;cursor:pointer;padding:4px;}
  .whoami{font-size:11px;color:#B9C7C4;}
  nav.modtabs{display:flex;gap:2px;margin-top:10px;flex-wrap:nowrap;overflow-x:auto;}
  nav.modtabs button{ flex:1;min-width:64px; background:transparent;border:none;color:#C7D3D1; padding:10px 4px;font-size:11px;font-weight:600;cursor:pointer;
    border-bottom:3px solid transparent;font-family:var(--font-body); -webkit-tap-highlight-color:transparent;white-space:nowrap; }
  nav.modtabs button.active{color:#fff;border-bottom-color:var(--brick);}
  nav.subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  nav.subtabs button{ background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);
    padding:7px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font-body); }
  nav.subtabs button.active{background:var(--teal-deep);color:#fff;border-color:var(--teal-deep);}
  main{padding:16px 16px 0;}
  .card{ background:var(--surface);border:1px solid var(--line);border-radius:var(--radius); padding:16px;margin-bottom:14px; }
  label.field-label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px;}
  select, input[type=text], input[type=date], input[type=url], input[type=number], input[type=tel], textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;
    font-family:var(--font-body);font-size:16px;background:#FBFAF7;color:var(--ink);
  }
  textarea{resize:vertical;min-height:44px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  @media (max-width:560px){.row2,.row3{grid-template-columns:1fr;}}
  optgroup{font-weight:600;}
  .cat-block{margin-bottom:16px;}
  .cat-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .cat-head .dot{width:9px;height:9px;border-radius:2px;background:var(--teal);}
  .cat-head h3{font-family:var(--font-display);font-size:14.5px;margin:0;letter-spacing:0.2px;}
  .cat-score{margin-left:auto;font-family:var(--font-mono);font-size:12.5px;color:var(--ink-soft);}
  .item{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px;background:#FCFBF9;}
  .item-text{font-size:13.5px;line-height:1.35;flex:1;}
  .crit{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brick);margin-right:6px;vertical-align:middle;}
  .score-btns{display:flex;gap:5px;margin-top:8px;}
  .score-btns button{ flex:1;padding:10px 2px;min-height:38px;border-radius:7px;border:1px solid var(--line);background:#fff;
    font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink-soft);-webkit-tap-highlight-color:transparent; }
  .score-btns button.selNA{background:var(--muted);color:#fff;border-color:var(--muted);}
  .score-btns button.sel1,.score-btns button.sel2{background:var(--brick);color:#fff;border-color:var(--brick);}
  .score-btns button.sel3{background:var(--amber);color:#fff;border-color:var(--amber);}
  .score-btns button.sel4,.score-btns button.sel5{background:var(--moss);color:#fff;border-color:var(--moss);}
  .item-extra{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap;}
  .item-extra input[type=text]{flex:1;min-width:120px;font-size:16px;padding:6px 8px;}
  .photo-btn{ font-size:11.5px;padding:6px 9px;border-radius:6px;border:1px dashed var(--ink-soft);
    background:transparent;color:var(--ink-soft);cursor:pointer;white-space:nowrap; }
  .photo-btn.has{border-style:solid;border-color:var(--teal);color:var(--teal);}
  .thumb-wrap{position:relative;display:inline-block;}
  .thumb{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line);}
  .thumb-x{position:absolute;top:-6px;right:-6px;background:var(--brick);color:#fff;border:none;
    width:16px;height:16px;border-radius:50%;font-size:10px;line-height:16px;cursor:pointer;padding:0;}
  .req-photo{font-size:10.5px;color:var(--brick);margin-top:4px;}
  .footer-bar{ background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;display:flex;align-items:center;gap:14px;margin:0 0 20px; }
  .score-badge{ font-family:var(--font-mono);font-weight:600;font-size:20px;
    width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    border:3px solid var(--teal);color:var(--teal);flex-shrink:0; }
  .score-badge.warn{border-color:var(--amber);color:var(--amber);}
  .score-badge.bad{border-color:var(--brick);color:var(--brick);}
  .save-btn{ flex:1;background:var(--teal-deep);color:#fff;border:none;border-radius:8px;
    padding:14px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:var(--font-body); }
  .save-btn:disabled{background:var(--muted);cursor:not-allowed;}
  h2.section-title{font-family:var(--font-display);font-size:16px;margin:2px 0 12px;}
  .empty{color:var(--ink-soft);font-size:13.5px;padding:20px;text-align:center;}
  .row-item{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#FCFBF9;}
  .row-item .meta{flex:1;}
  .row-item .meta .d{font-size:13px;font-weight:600;}
  .row-item .meta .s{font-size:11.5px;color:var(--ink-soft);}
  .del-btn{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px;}
  .pill{font-size:10.5px;padding:3px 9px;border-radius:12px;font-weight:700;white-space:nowrap;}
  .pill.pendiente{background:#EFE6D4;color:var(--amber);}
  .pill.en_proceso{background:#DCE8F0;color:#2A6F8E;}
  .pill.hecha,.pill.instalada,.pill.aprobada,.pill.enviada,.pill.resuelta,.pill.consolidada{background:#E4F0E9;color:var(--moss);}
  .pill.rechazada{background:#FCEBE8;color:var(--brick);}
  .pill.atrasada{background:#FCEBE8;color:var(--brick);}
  .detail-modal{position:fixed;inset:0;background:rgba(20,24,26,0.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .detail-sheet{background:var(--surface);width:100%;max-width:920px;max-height:88vh;overflow-y:auto;border-radius:14px 14px 0 0;padding:18px;}
  .detail-sheet .close-x{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);}
  .detail-item{border-bottom:1px solid var(--line);padding:9px 0;}
  .detail-item .st{font-size:11px;font-weight:700;text-transform:uppercase;}
  .detail-item img{max-width:150px;border-radius:6px;margin-top:6px;display:block;}
  .detail-item .cm{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .stat-select{margin-bottom:14px;}
  .rank-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .rank-table{width:100%;min-width:480px;border-collapse:collapse;font-size:13px;}
  .rank-table th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--line);padding:6px 8px;}
  .rank-table td{padding:8px;border-bottom:1px solid var(--line);}
  .rank-table td.sc{font-family:var(--font-mono);font-weight:600;}
  .badgebrand{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--teal);color:#fff;margin-right:6px;}
  .badgebrand.bz{background:var(--brick);}
  .fail-list{list-style:none;padding:0;margin:10px 0 0;}
  .fail-list li{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);}
  .fail-list li .n{color:var(--ink-soft);}
  .status-line{font-size:12px;padding:8px 10px;border-radius:7px;margin-bottom:10px;}
  .status-line.ok{background:#E4F0E9;color:var(--moss);}
  .status-line.bad{background:#FCEBE8;color:var(--brick);}
  .storechk{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px;}
  .storechk input{width:auto;}
  .pinpad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;max-width:280px;margin:16px auto 0;}
  .pinpad button{padding:16px;font-size:20px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;}
  .pindots{display:flex;justify-content:center;gap:10px;margin:18px 0;}
  .pindots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--teal);}
  .pindots span.filled{background:var(--teal);}
  .logout-link{font-size:11px;color:#B9C7C4;text-decoration:underline;background:none;border:none;cursor:pointer;padding:0;}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brandrow">
      <div>
        <h1>Gestión de Tiendas</h1>
        <div class="sub" id="subLabel">DIB / Bazhars</div>
      </div>
      <div class="headerbtns">
        <span class="whoami" id="whoami"></span>
        <button class="gear" id="gearBtn" title="Configuración">⚙</button>
      </div>
    </div>
    <nav class="modtabs" id="modTabs"></nav>
  </header>
  <main id="main"></main>
</div>

<script>
/* ======================= CONFIG ======================= */
function getApiUrl(){ return localStorage.getItem('checklistApiUrl') || DEFAULT_API_URL || ''; }
function setApiUrl(u){ localStorage.setItem('checklistApiUrl', u); }
const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbyt5gpC5HdvkkCIzBQ2EjeBdIdq35Ny57GrvvnBdl4Krb3-p48wmgBOL3skARgkHgnbGw/exec'; // pega aquí la URL de Apps Script para que quede fija para todos

function getAuth(){ try{ return JSON.parse(localStorage.getItem('checklistAuth')||'null'); }catch(e){ return null; } }
function setAuth(a){ localStorage.setItem('checklistAuth', JSON.stringify(a)); }
function clearAuth(){ localStorage.removeItem('checklistAuth'); }

/* ======================= DATA MAESTRA ======================= */
const STORES = [
  {id:'dib_outlet_el_salto', brand:'DIB', name:'DIB Outlet El Salto'},
  {id:'dib_cerrillos_plaza_oeste', brand:'DIB', name:'DIB Cerrillos Plaza Oeste'},
  {id:'dib_vina_local_telas', brand:'DIB', name:'DIB Viña Local Telas'},
  {id:'dib_vina_local_alfombras', brand:'DIB', name:'DIB Viña Local Alfombras'},
  {id:'dib_quilicura_easton_center', brand:'DIB', name:'DIB Quilicura Easton Center'},
  {id:'dib_temuco_easton', brand:'DIB', name:'DIB Temuco Easton'},
  {id:'dib_la_florida', brand:'DIB', name:'DIB La Florida'},
  {id:'dib_san_joaquin_la_fabrica', brand:'DIB', name:'DIB San Joaquín La Fábrica'},
  {id:'dib_maipu_vivo', brand:'DIB', name:'DIB Maipú Vivo'},
  {id:'dib_puerto_montt_costanera', brand:'DIB', name:'DIB Puerto Montt Costanera'},
  {id:'dib_temuco_vivo', brand:'DIB', name:'DIB Temuco Vivo'},
  {id:'dib_vina_outlet_park', brand:'DIB', name:'DIB Viña Outlet Park'},
  {id:'dib_puerto_montt_alerce', brand:'DIB', name:'DIB Puerto Montt Alerce'},
  {id:'dib_rancagua', brand:'DIB', name:'DIB Rancagua'},
  {id:'bz_parque_arauco', brand:'BAZHARS', name:'Bazhars Parque Arauco'},
  {id:'bz_trebol', brand:'BAZHARS', name:'Bazhars Trébol'},
  {id:'bz_vitacura', brand:'BAZHARS', name:'Bazhars Vitacura'},
  {id:'bz_la_serena', brand:'BAZHARS', name:'Bazhars La Serena'},
  {id:'bz_la_dehesa', brand:'BAZHARS', name:'Bazhars La Dehesa'},
  {id:'bz_montemar', brand:'BAZHARS', name:'Bazhars Montemar'},
  {id:'bz_temuco', brand:'BAZHARS', name:'Bazhars Temuco'},
];
function storeName(id){ const s=STORES.find(function(x){return x.id===id;}); return s? s.name : id; }
const CHECKLIST = [
  {cat:'Personal', items:[
    {id:'p1', text:'Dotación completa presente según turno planificado', crit:false},
    {id:'p2', text:'Uniforme y presentación personal correcta (aseo, cabello, credencial)', crit:true},
    {id:'p3', text:'Personal distribuido en piso de venta, no concentrado en caja/bodega', crit:false},
  ]},
  {cat:'Presentación', items:[
    {id:'e1', text:'Vitrina y fachada limpias, exhibición vigente y atractiva', crit:true},
    {id:'e2', text:'Mobiliario, exhibidores y maniquíes en buen estado (sin roturas)', crit:false},
    {id:'e3', text:'Señalética de precios y promociones visible, correcta y vigente', crit:true},
  ]},
  {cat:'Orden', items:[
    {id:'o1', text:'Productos ordenados y clasificados por línea/categoría', crit:false},
    {id:'o2', text:'Pasillos y zonas de circulación despejados', crit:false},
    {id:'o3', text:'Bodega/trastienda ordenada y con stock identificado', crit:false},
  ]},
  {cat:'Limpieza', items:[
    {id:'l1', text:'Piso limpio, sin polvo ni residuos', crit:true},
    {id:'l2', text:'Mesones, vitrinas y muebles sin polvo', crit:false},
    {id:'l3', text:'Baño/comedor de personal limpio y operativo', crit:false},
  ]},
  {cat:'Protocolo de atención', items:[
    {id:'a1', text:'Saludo y abordaje al cliente según protocolo', crit:false},
    {id:'a2', text:'Indagación de necesidad y asesoría de producto', crit:false},
    {id:'a3', text:'Cierre de venta y despedida conforme a protocolo', crit:false},
  ]},
];
const ALL_ITEMS = CHECKLIST.flatMap(function(c){ return c.items.map(function(i){ return Object.assign({},i,{cat:c.cat}); }); });

/* ======================= ESTADO GLOBAL ======================= */
let state = { modTab:'auditorias', subTab:{ auditorias:'nueva', carteleria:'mitienda', tareas:'mis', materiales:'pedido', solicitudes:'nueva' } };
let draft = { storeId:'', auditor:'', responses:{} };
ALL_ITEMS.forEach(function(i){ draft.responses[i.id] = {puntaje:null, comment:'', photo:null}; });
let period = { mode:'all', from:'', to:'' };
let cache = {};

/* ======================= API ======================= */
async function apiGet(qs){
  const url = getApiUrl();
  if(!url) throw new Error('NO_CONFIG');
  const auth = getAuth();
  const pinQs = auth ? '&pin='+encodeURIComponent(auth.pin) : '';
  const res = await fetch(url + '?' + qs + pinQs);
  if(!res.ok) throw new Error('HTTP '+res.status);
  return res.json();
}
async function apiPost(payload){
  const url = getApiUrl();
  if(!url) throw new Error('NO_CONFIG');
  const auth = getAuth();
  payload.pin = auth ? auth.pin : '';
  const res = await fetch(url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) });
  if(!res.ok) throw new Error('HTTP '+res.status);
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'El backend rechazó la operación');
  return json;
}
function escAttr(s){ return (s||'').toString().replace(/"/g,'&quot;'); }
function errorCard(err){ return '<div class="card"><div class="status-line bad">No se pudo cargar: '+err.message+'</div></div>'; }
function currentMes(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }

/* ======================= FOTOS ======================= */
function fileToCompressedDataURL(file){
  return new Promise(function(resolve,reject){
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        const maxW = 480;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.55));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function photoField(id, currentUrl){
  return '<button class="photo-btn '+(currentUrl?'has':'')+'" data-photobtn="'+id+'">'+(currentUrl?'Foto ✓':'📷 Adjuntar')+'</button>'+
    '<input type="file" accept="image/*" data-photoinput="'+id+'" style="display:none">'+
    (currentUrl?'<span class="thumb-wrap"><img class="thumb" src="'+currentUrl+'"><button class="thumb-x" data-photodel="'+id+'">×</button></span>':'');
}
function bindPhotoField(container, id, onChange){
  const btn = container.querySelector('[data-photobtn="'+id+'"]');
  const inp = container.querySelector('[data-photoinput="'+id+'"]');
  if(!btn) return;
  btn.addEventListener('click', function(){ inp.click(); });
  inp.addEventListener('change', async function(e){
    const f = e.target.files[0]; if(!f) return;
    const dataUrl = await fileToCompressedDataURL(f);
    onChange(dataUrl);
  });
  const delBtn = container.querySelector('[data-photodel="'+id+'"]');
  if(delBtn) delBtn.addEventListener('click', function(e){ e.stopPropagation(); onChange(null); });
}

/* ======================= LOGIN ======================= */
let pinBuffer = '';
let selectedRole = null;
const ROLE_OPTIONS = [
  {id:'admin', label:'Administrador'},
  {id:'supervisor', label:'Supervisor'},
  {id:'jefe_tienda', label:'Jefe de Tienda'},
];
function renderLogin(){
  document.getElementById('modTabs').innerHTML = '';
  document.getElementById('whoami').textContent = '';
  selectedRole = null;
  renderRoleSelect();
}
function renderRoleSelect(){
  pinBuffer = '';
  const html = '<div class="card" style="text-align:center;max-width:340px;margin:20px auto;">'+
    '<h2 class="section-title">¿Con qué perfil ingresas?</h2>'+
    '<div style="display:flex;flex-direction:column;gap:10px;margin-top:14px;">'+
      ROLE_OPTIONS.map(function(r){ return '<button class="save-btn" data-role="'+r.id+'" style="background:var(--teal-deep);">'+r.label+'</button>'; }).join('')+
    '</div></div>';
  document.getElementById('main').innerHTML = html;
  document.querySelectorAll('[data-role]').forEach(function(b){
    b.addEventListener('click', function(){ selectedRole = b.dataset.role; renderPinScreen(); });
  });
}
function renderPinScreen(){
  pinBuffer = '';
  const roleLabel = ROLE_OPTIONS.find(function(r){return r.id===selectedRole;}).label;
  const html = '<div class="card" style="text-align:center;max-width:340px;margin:20px auto;">'+
    '<button class="logout-link" id="backRoleBtn" style="margin-bottom:10px;">‹ cambiar perfil</button>'+
    '<h2 class="section-title">PIN de '+roleLabel+'</h2>'+
    '<div class="pindots" id="pindots"></div>'+
    '<div class="pinpad">'+
      [1,2,3,4,5,6,7,8,9].map(function(n){ return '<button data-num="'+n+'">'+n+'</button>'; }).join('')+
      '<button data-num="del">⌫</button><button data-num="0">0</button><button data-num="ok">OK</button>'+
    '</div>'+
    '<div id="loginStatus" style="margin-top:10px;"></div>'+
  '</div>';
  document.getElementById('main').innerHTML = html;
  renderPinDots();
  document.getElementById('backRoleBtn').addEventListener('click', renderRoleSelect);
  document.querySelectorAll('[data-num]').forEach(function(b){
    b.addEventListener('click', function(){
      const n = b.dataset.num;
      if(n==='del'){ pinBuffer = pinBuffer.slice(0,-1); }
      else if(n==='ok'){ tryLogin(); return; }
      else if(pinBuffer.length<6){ pinBuffer += n; }
      renderPinDots();
    });
  });
}
function renderPinDots(){
  document.getElementById('pindots').innerHTML = Array.from({length:Math.max(pinBuffer.length,4)}).map(function(_,i){
    return '<span class="'+(i<pinBuffer.length?'filled':'')+'"></span>';
  }).join('');
}
async function tryLogin(){
  const statusEl = document.getElementById('loginStatus');
  statusEl.innerHTML = '<div class="status-line">Validando…</div>';
  try{
    const url = getApiUrl();
    const res = await fetch(url + '?action=login&pin=' + encodeURIComponent(pinBuffer));
    const json = await res.json();
    if(!json.ok){ statusEl.innerHTML = '<div class="status-line bad">PIN no reconocido.</div>'; pinBuffer=''; renderPinDots(); return; }
    if(json.rol !== selectedRole){
      statusEl.innerHTML = '<div class="status-line bad">Ese PIN no corresponde al perfil "'+ROLE_OPTIONS.find(function(r){return r.id===selectedRole;}).label+'".</div>';
      pinBuffer=''; renderPinDots(); return;
    }

/* ======================= SCORING (1-5) ======================= */
function computeScore(responses){
  let sum=0, cnt=0; const byCat={};
  CHECKLIST.forEach(function(c){
    let csum=0, ccnt=0;
    c.items.forEach(function(i){
      const p = responses[i.id] ? responses[i.id].puntaje : null;
      if(p){ csum+=p; ccnt++; sum+=p; cnt++; }
    });
    byCat[c.cat] = ccnt ? Math.round(csum/ccnt/5*100) : null;
  });
  return { overall: cnt ? Math.round(sum/cnt/5*100) : null, byCat: byCat };
}
function estadoToPuntaje(v){ const n = Number(v); return (n>=1 && n<=5) ? n : null; }
function groupVisitRows(rows){
  const byVisit = {};
  rows.forEach(function(r){
    if(!byVisit[r.visit_id]) byVisit[r.visit_id] = { id:r.visit_id, storeId:r.tienda_id, date:r.fecha, auditor:r.auditor, responses:{} };
    byVisit[r.visit_id].responses[r.item_id] = { puntaje: estadoToPuntaje(r.puntaje), comment:r.comentario||'', photo:r.foto_url||null };
  });
  const result = {}; STORES.forEach(function(s){ result[s.id]=[]; });
  Object.keys(byVisit).forEach(function(vid){
    const v = byVisit[vid];
    const score = computeScore(v.responses);
    v.scoreOverall = score.overall; v.scoreByCat = score.byCat;
    if(!result[v.storeId]) result[v.storeId]=[];
    result[v.storeId].push(v);
  });
  return result;
}
async function loadAllVisits(force){
  if(cache.visitas && !force) return groupVisitRows(cache.visitas);
  const json = await apiGet('action=list_visitas');
  if(!json.ok) throw new Error(json.error||'Error al leer visitas');
  cache.visitas = json.rows;
  return groupVisitRows(cache.visitas);
}

/* ======================= FILTRO DE PERIODO (compartido) ======================= */
function periodFilterHTML(){
  const custom = period.mode==='custom';
  return '<div class="card"><label class="field-label">Periodo</label>'+
    '<select id="periodMode" style="margin-bottom:'+(custom?'10px':'0')+';">'+
      '<option value="all" '+(period.mode==='all'?'selected':'')+'>Todo el periodo</option>'+
      '<option value="thisMonth" '+(period.mode==='thisMonth'?'selected':'')+'>Este mes</option>'+
      '<option value="lastMonth" '+(period.mode==='lastMonth'?'selected':'')+'>Mes anterior</option>'+
      '<option value="last30" '+(period.mode==='last30'?'selected':'')+'>Últimos 30 días</option>'+
      '<option value="custom" '+(custom?'selected':'')+'>Rango personalizado</option>'+
    '</select>'+
    (custom?('<div class="row2"><div><label class="field-label">Desde</label><input type="date" id="periodFrom" value="'+(period.from||'')+'"></div>'+
      '<div><label class="field-label">Hasta</label><input type="date" id="periodTo" value="'+(period.to||'')+'"></div></div>'):'')+
  '</div>';
}
function applyPeriodMode(mode){
  const today = new Date(); const pad=function(n){return String(n).padStart(2,'0');};
  const iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
  if(mode==='all'){ period = {mode:'all', from:'', to:''}; }
  else if(mode==='thisMonth'){ const first=new Date(today.getFullYear(),today.getMonth(),1); period={mode:mode,from:iso(first),to:iso(today)}; }
  else if(mode==='lastMonth'){ const first=new Date(today.getFullYear(),today.getMonth()-1,1); const last=new Date(today.getFullYear(),today.getMonth(),0); period={mode:mode,from:iso(first),to:iso(last)}; }
  else if(mode==='last30'){ const from=new Date(today); from.setDate(from.getDate()-30); period={mode:mode,from:iso(from),to:iso(today)}; }
  else if(mode==='custom'){ period={mode:mode, from:period.from||iso(today), to:period.to||iso(today)}; }
}
function bindPeriodBar(onChange){
  const sel = document.getElementById('periodMode');
  if(sel) sel.addEventListener('change', function(e){ applyPeriodMode(e.target.value); onChange(); });
  const cFrom = document.getElementById('periodFrom'), cTo = document.getElementById('periodTo');
  if(cFrom) cFrom.addEventListener('change', function(e){ period.from = e.target.value; onChange(); });
  if(cTo) cTo.addEventListener('change', function(e){ period.to = e.target.value; onChange(); });
}
function inPeriod(iso){
  if(period.mode==='all') return true;
  if(!period.from || !period.to) return true;
  const d = new Date(iso), df = new Date(period.from+'T00:00:00'), dt = new Date(period.to+'T23:59:59');
  return d>=df && d<=dt;
}
function periodLabel(){ return period.mode==='all' ? 'todo el periodo' : ('del '+(period.from||'')+' al '+(period.to||'')); }

/* ======================= MINI-CHARTS ======================= */
function buildBarListHTML(items){
  return items.map(function(it){
    const pct = it.value===null ? 0 : it.value;
    return '<div style="margin-bottom:9px;"><div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);margin-bottom:3px;">'+
      '<span>'+it.label+'</span><span style="font-family:var(--font-mono);font-weight:600;color:var(--ink);">'+(it.value===null?'—':it.value+'%')+'</span></div>'+
      '<div style="background:#EFEDE6;border-radius:5px;height:10px;overflow:hidden;"><div style="width:'+pct+'%;height:100%;background:'+it.color+';border-radius:5px;"></div></div></div>';
  }).join('');
}
function buildTrendSVG(points){
  if(points.length===0) return '<div class="empty">Sin datos en este periodo.</div>';
  const w=320,h=150,padL=26,padR=8,padT=10,padB=22, innerW=w-padL-padR, innerH=h-padT-padB, n=points.length;
  const stepX = n>1 ? innerW/(n-1) : 0;
  const xy = points.map(function(p,idx){
    const x = padL + (n>1 ? idx*stepX : innerW/2);
    const y = padT + innerH - (p.value/100*innerH);
    return {x:x,y:y,label:p.label};
  });
  const pathD = xy.map(function(p,i){ return (i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1); }).join(' ');
  const areaD = pathD+' L'+xy[xy.length-1].x.toFixed(1)+','+(padT+innerH).toFixed(1)+' L'+xy[0].x.toFixed(1)+','+(padT+innerH).toFixed(1)+' Z';
  const gridLines = [0,25,50,75,100].map(function(v){
    const y = padT + innerH - (v/100*innerH);
    return '<line x1="'+padL+'" y1="'+y+'" x2="'+(w-padR)+'" y2="'+y+'" stroke="#E1DFD6" stroke-width="1"/><text x="0" y="'+(y+3)+'" font-size="8" fill="#9A9A8E">'+v+'</text>';
  }).join('');
  const dots = xy.map(function(p){ return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3" fill="#28565C"/>'; }).join('');
  const labelEvery = n<=6 ? 1 : Math.ceil(n/6);
  const labels = xy.map(function(p,i){ return i%labelEvery===0 ? '<text x="'+p.x.toFixed(1)+'" y="'+(h-6)+'" font-size="8" fill="#9A9A8E" text-anchor="middle">'+p.label+'</text>' : ''; }).join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;display:block;">'+gridLines+
    '<path d="'+areaD+'" fill="rgba(40,86,92,0.15)" stroke="none"/><path d="'+pathD+'" fill="none" stroke="#28565C" stroke-width="2"/>'+dots+labels+'</svg>';
}

    '<select id="statSel"><option value="">Todas</option>'+storeOptionsHTML(statStoreId).replace('<option value="">Selecciona tienda…</option>','')+'</select></div>'+periodFilterHTML();
  document.getElementById('main').innerHTML = html + '<div class="empty">Cargando…</div>';
  let allRaw;
  try{ allRaw = await loadAllVisits(); } catch(err){ document.getElementById('main').innerHTML = html + errorCard(err); return; }
  const all = {}; Object.keys(allRaw).forEach(function(k){ all[k] = allRaw[k].filter(function(v){return inPeriod(v.date);}); });
  const barItems = scopedStores().map(function(s){
    const vs = all[s.id]; const avg = vs.length ? Math.round(vs.reduce(function(a,v){return a+v.scoreOverall;},0)/vs.length) : null;
    return { label: s.name.replace(/^(DIB|Bazhars)\s*/,''), value: avg, color: s.brand==='DIB'?'#28565C':'#B8412E' };
  });
  let trendHTML = ''; let visitsForFail = [];
  if(statStoreId){
    visitsForFail = all[statStoreId];
    const sorted = visitsForFail.slice().sort(function(a,b){return new Date(a.date)-new Date(b.date);});
    const points = sorted.map(function(v){ return { label:new Date(v.date).toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit'}), value:v.scoreOverall }; });
    trendHTML = '<div class="card"><h2 class="section-title">Evolución</h2>'+buildTrendSVG(points)+'</div>';
  } else { Object.values(all).forEach(function(vs){ visitsForFail = visitsForFail.concat(vs); }); }
  const failCounts = {}; ALL_ITEMS.forEach(function(i){ failCounts[i.id]={text:i.text,bad:0,total:0}; });
  visitsForFail.forEach(function(v){
    Object.keys(v.responses).forEach(function(id){ const r=v.responses[id]; if(r.puntaje){ failCounts[id].total++; if(r.puntaje<=2) failCounts[id].bad++; } });
  });
  const failArr = Object.values(failCounts).filter(function(f){return f.total>0;}).sort(function(a,b){return (b.bad/b.total)-(a.bad/a.total);}).slice(0,6);
  const failListHTML = failArr.length===0 ? '<li>Aún no hay datos suficientes.</li>' : failArr.map(function(f){return '<li><span>'+f.text+'</span><span class="n">'+f.bad+'/'+f.total+' veces ≤2</span></li>';}).join('');
  document.getElementById('main').innerHTML = html + '<div class="card"><h2 class="section-title">Cumplimiento promedio por tienda</h2>'+buildBarListHTML(barItems)+'</div>'+
    trendHTML + '<div class="card"><h2 class="section-title">Puntos más débiles (puntaje ≤2)</h2><ul class="fail-list">'+failListHTML+'</ul></div>';
  document.getElementById('statSel').value = statStoreId;
  document.getElementById('statSel').addEventListener('change', function(e){ statStoreId=e.target.value; renderAudStats(); });
  bindPeriodBar(renderAudStats);
}
async function renderAudRanking(){
  document.getElementById('main').innerHTML += periodFilterHTML() + '<div class="empty">Cargando…</div>';
  let allRaw;
  try{ allRaw = await loadAllVisits(); } catch(err){ document.getElementById('main').innerHTML += errorCard(err); return; }
  const all = {}; Object.keys(allRaw).forEach(function(k){ all[k] = allRaw[k].filter(function(v){return inPeriod(v.date);}); });
  const rows = scopedStores().map(function(s){
    const vs = all[s.id]; const avg = vs.length ? Math.round(vs.reduce(function(a,v){return a+v.scoreOverall;},0)/vs.length) : null;
    const last = vs.length ? vs.slice().sort(function(a,b){return new Date(b.date)-new Date(a.date);})[0] : null;
    return {s:s, avg:avg, count:vs.length, last:last};
  }).sort(function(a,b){ if(a.avg===null) return 1; if(b.avg===null) return -1; return b.avg-a.avg; });
  let html = document.getElementById('main').innerHTML.split('<div class="empty">Cargando…</div>')[0] +
    '<div class="card"><h2 class="section-title">Ranking — '+periodLabel()+'</h2><div class="rank-table-wrap"><table class="rank-table"><thead><tr><th>Tienda</th><th>Visitas</th><th>Promedio</th><th>Última</th></tr></thead><tbody>';
  rows.forEach(function(r){
    const brandCls = r.s.brand==='DIB'?'':'bz';
    const lastDt = r.last ? new Date(r.last.date).toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—';
    html += '<tr><td><span class="badgebrand '+brandCls+'">'+r.s.brand+'</span>'+r.s.name.replace(/^(DIB|Bazhars)\s*/,'')+'</td><td>'+r.count+'</td><td class="sc">'+(r.avg===null?'—':r.avg+'%')+'</td><td>'+lastDt+'</td></tr>';
  });
  html += '</tbody></table></div></div>';
  document.getElementById('main').innerHTML = html;
  bindPeriodBar(renderAudRanking);
}
function csvEscape(v){ const s=(v===null||v===undefined)?'':String(v); return /[",\n;]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function downloadBlob(content, filename, mime){
  const blob = new Blob([content], {type:mime}); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
}
function fmtDateCSV(iso){ const d=new Date(iso); const pad=function(n){return String(n).padStart(2,'0');}; return pad(d.getDate())+'-'+pad(d.getMonth()+1)+'-'+d.getFullYear(); }
async function exportAudDetailCSV(){

        const r = v.responses[i.id] || {};
        rows.push([s.name, s.brand, fmtDateCSV(v.date), v.auditor||'', i.cat, i.text, i.crit?'Si':'No', r.puntaje||'', r.comment||'', r.photo?'Si':'No', v.scoreOverall]);
      });
    });
  });
  downloadBlob('\uFEFF'+rows.map(function(r){return r.map(csvEscape).join(';');}).join('\n'), 'auditorias_detalle_'+new Date().toISOString().slice(0,10)+'.csv', 'text/csv;charset=utf-8');
}

async function renderCarteleria(){

  const ventanaAbierta = diaHoy <= 5;
  let html = head + '<div class="status-line '+(ventanaAbierta?'ok':'bad')+'">'+
    (ventanaAbierta ? 'Ventana de pedidos abierta (días 1 al 5). Mes actual: '+mes : 'Ventana cerrada — tu pedido quedará marcado como atrasado. Mes actual: '+mes)+
  '</div>';
  if(auth.rol==='jefe_tienda'){
    html += '<div class="card"><h2 class="section-title">Agregar ítem al pedido</h2>'+
      '<div class="row3"><div><label class="field-label">Producto</label><input type="text" id="matProd"></div>'+
      '<div><label class="field-label">Cantidad</label><input type="number" id="matCant"></div>'+
      '<div><label class="field-label">Unidad</label><input type="text" id="matUnidad" placeholder="cajas, unid, m2…"></div></div>'+
      '<div style="margin-top:10px;"><label class="field-label">Motivo (opcional)</label><input type="text" id="matDesc"></div>'+
      '<button class="save-btn" id="addMatBtn" style="margin-top:10px;">Agregar al pedido de este mes</button></div>';
  }
  // El backend ya filtra por rol (jefe_tienda solo ve su tienda); acá solo filtramos por mes.
  const misItems = data.rows.filter(function(r){ return r.mes===mes; });
  html += '<div class="card"><h2 class="section-title">Pedido de '+mes+'</h2>';
  if(misItems.length===0){ html += '<div class="empty">Sin ítems aún.</div>'; }
  else{
    misItems.forEach(function(r){
      html += '<div class="row-item"><div class="meta"><div class="d">'+r.producto_asunto+' — '+r.cantidad+' '+r.unidad+'</div>'+
        '<div class="s">'+(auth.rol!=='jefe_tienda'?storeName(r.tienda_id)+' · ':'')+(r.descripcion||'')+'</div></div>'+
        '<span class="pill '+r.estado+'">'+r.estado+'</span>'+(r.atrasada==='Si'?'<span class="pill atrasada">atrasado</span>':'')+'</div>';
    });
  }
  html += '</div>';
  document.getElementById('main').innerHTML = html;
  const addBtn = document.getElementById('addMatBtn');
  if(addBtn) addBtn.addEventListener('click', async function(){
    const prod = document.getElementById('matProd').value.trim();
    if(!prod){ alert('Falta el producto'); return; }
    if(addBtn.disabled) return;
    addBtn.disabled = true; addBtn.textContent = 'Guardando…';
    try{
      await apiPost({action:'save_solicitud', tienda_id:auth.tienda_id, tipo:'material', producto_asunto:prod,
        cantidad:document.getElementById('matCant').value, unidad:document.getElementById('matUnidad').value, descripcion:document.getElementById('matDesc').value});
      cache.solicitudes=null; renderMateriales();
    }catch(err){ alert('Error: '+err.message); addBtn.disabled = false; addBtn.textContent = 'Agregar al pedido de este mes'; }
  });
}
function renderMatConsolidado(head, data){
  const mes = currentMes();
  const items = data.rows.filter(function(r){return r.mes===mes;});
  const cons = data.consolidados.find(function(c){return c.mes===mes;});
  const estado = cons ? cons.estado : 'abierto';
  let html = head + '<div class="card"><h2 class="section-title">Consolidado — '+mes+'</h2>'+
    '<div class="status-line '+(estado==='enviado'?'ok':'')+'">Estado: <b>'+estado+'</b>'+(cons&&cons.aprobado_por?' · aprobado por '+cons.aprobado_por:'')+'</div>';
  if(items.length===0){ html += '<div class="empty">Sin pedidos este mes todavía.</div>'; }
  else{
    html += '<div class="rank-table-wrap"><table class="rank-table"><thead><tr><th>Tienda</th><th>Producto</th><th>Cant.</th><th>Unidad</th><th>Estado</th></tr></thead><tbody>';
    items.forEach(function(r){ html += '<tr><td>'+storeName(r.tienda_id)+'</td><td>'+r.producto_asunto+'</td><td>'+r.cantidad+'</td><td>'+r.unidad+'</td><td>'+(r.atrasada==='Si'?'<span class="pill atrasada">atrasado</span>':'ok')+'</td></tr>'; });
    html += '</tbody></table></div>';
  }
  html += '<div style="display:flex;gap:8px;margin-top:12px;">'+
    '<button class="save-btn" id="btnAprobar">Aprobar consolidado</button>'+
    '<button class="save-btn" id="btnEnviar" style="background:var(--teal);">Enviar a Operaciones</button>'+
    '<button class="save-btn" id="btnCsvMat" style="background:var(--ink-soft);">CSV</button></div></div>';
  document.getElementById('main').innerHTML = html;
  const btnAprobar = document.getElementById('btnAprobar');
  btnAprobar.addEventListener('click', async function(){
    if(btnAprobar.disabled) return; btnAprobar.disabled = true;
    try{ await apiPost({action:'aprobar_consolidado', mes:mes}); cache.solicitudes=null; renderMateriales(); } catch(err){ alert('Error: '+err.message); btnAprobar.disabled = false; }
  });
  const btnEnviar = document.getElementById('btnEnviar');
  btnEnviar.addEventListener('click', async function(){
    if(!confirm('¿Enviar el consolidado de '+mes+' a Operaciones?')) return;
    if(btnEnviar.disabled) return; btnEnviar.disabled = true;
    try{ await apiPost({action:'enviar_consolidado', mes:mes}); cache.solicitudes=null; renderMateriales(); } catch(err){ alert('Error: '+err.message); btnEnviar.disabled = false; }
  });
  document.getElementById('btnCsvMat').addEventListener('click', function(){
    const rows = [['tienda','producto','cantidad','unidad','descripcion','atrasado']];
    items.forEach(function(r){ rows.push([storeName(r.tienda_id), r.producto_asunto, r.cantidad, r.unidad, r.descripcion, r.atrasada]); });
    downloadBlob('\uFEFF'+rows.map(function(r){return r.map(csvEscape).join(';');}).join('\n'), 'consolidado_materiales_'+mes+'.csv', 'text/csv;charset=utf-8');
  });
}
function renderMatCumplimiento(head, data){
  const mes = currentMes();
  let html = head + '<div class="card"><h2 class="section-title">Cumplimiento envío mensual — '+mes+'</h2><div class="rank-table-wrap"><table class="rank-table"><thead><tr><th>Tienda</th><th>Estado</th></tr></thead><tbody>';
  STORES.forEach(function(s){
    const enviado = data.rows.some(function(r){return r.tienda_id===s.id && r.mes===mes;});
    const atrasado = data.rows.some(function(r){return r.tienda_id===s.id && r.mes===mes && r.atrasada==='Si';});
    html += '<tr><td>'+s.name+'</td><td>'+(enviado?('<span class="pill '+(atrasado?'atrasada':'hecha')+'">'+(atrasado?'enviado tarde':'enviado')+'</span>'):'<span class="pill rechazada">sin enviar</span>')+'</td></tr>';
  });
  html += '</tbody></table></div></div>';
  document.getElementById('main').innerHTML = html;
}

/* ======================= MODULO: SOLICITUDES A ADMINISTRACION ======================= */
async function renderSolicitudesAdmin(){
  const auth = getAuth();
  const tabs = [];
  tabs.push({id:'nueva',label:'Nueva solicitud'});
  if(auth.rol!=='jefe_tienda'){ tabs.push({id:'bandeja',label:'Bandeja'}); tabs.push({id:'cumplimiento',label:'Cumplimiento'}); }
  if(!tabs.find(function(t){return t.id===state.subTab.solicitudes;})) state.subTab.solicitudes = tabs[0].id;
  const active = state.subTab.solicitudes;
  document.getElementById('main').innerHTML = subtabsHTML(tabs, active) + '<div class="empty">Cargando…</div>';
  bindSubtabs('solicitudes', renderSolicitudesAdmin);
  let data;
  try{ data = await apiGet('action=list_solicitudes'); if(!data.ok) throw new Error(data.error); } catch(err){ document.getElementById('main').innerHTML = subtabsHTML(tabs, active) + errorCard(err); return; }
  data.rows = data.rows.filter(function(r){ return r.tipo==='administracion'; });
  const head = subtabsHTML(tabs, active);
  if(active==='nueva') renderSolNueva(head, data);
  else if(active==='bandeja') renderSolBandeja(head, data);
  else if(active==='cumplimiento') renderSolCumplimiento(head, data);
}
function renderSolNueva(head, data){
  const auth = getAuth();
  let html = head;
  if(auth.rol==='jefe_tienda'){
    html += '<div class="card"><h2 class="section-title">Nueva solicitud a Administración</h2>'+
      '<label class="field-label">Asunto</label><input type="text" id="solAsunto">'+
      '<div style="margin-top:10px;"><label class="field-label">Descripción</label><textarea id="solDesc"></textarea></div>'+
      '<div style="margin-top:10px;"><label class="field-label">Urgencia</label><select id="solUrg"><option value="normal">Normal</option><option value="alta">Alta</option></select></div>'+
      '<button class="save-btn" id="addSolBtn" style="margin-top:10px;">Enviar solicitud</button></div>';
  }
  // El backend ya filtra por rol.
  const mios = data.rows.slice().sort(function(a,b){return new Date(b.fecha_solicitud)-new Date(a.fecha_solicitud);});
  html += '<div class="card"><h2 class="section-title">Mis solicitudes</h2>';
  if(mios.length===0){ html += '<div class="empty">Sin solicitudes aún.</div>'; }
  else{
    mios.forEach(function(r){
      html += '<div class="row-item"><div class="meta"><div class="d">'+r.producto_asunto+'</div><div class="s">'+(auth.rol!=='jefe_tienda'?storeName(r.tienda_id)+' · ':'')+(r.descripcion||'')+'</div>'+
        (r.respuesta_admin?'<div class="s" style="margin-top:4px;"><b>Respuesta:</b> '+r.respuesta_admin+'</div>':'')+'</div><span class="pill '+r.estado+'">'+r.estado+'</span></div>';
    });
  }
  html += '</div>';
  document.getElementById('main').innerHTML = html;
  const addBtn = document.getElementById('addSolBtn');
  if(addBtn) addBtn.addEventListener('click', async function(){
    const asunto = document.getElementById('solAsunto').value.trim();
    if(!asunto){ alert('Falta el asunto'); return; }
    if(addBtn.disabled) return;
    addBtn.disabled = true; addBtn.textContent = 'Enviando…';
    try{
      await apiPost({action:'save_solicitud', tienda_id:auth.tienda_id, tipo:'administracion', producto_asunto:asunto,
        descripcion:document.getElementById('solDesc').value, urgencia:document.getElementById('solUrg').value});
      cache.solicitudes=null; renderSolicitudesAdmin();
    }catch(err){ alert('Error: '+err.message); addBtn.disabled = false; addBtn.textContent = 'Enviar solicitud'; }
  });
}
function renderSolBandeja(head, data){
  let html = head + '<div class="card"><h2 class="section-title">Bandeja de solicitudes</h2>';
  const pend = data.rows.filter(function(r){return r.estado==='pendiente';}).sort(function(a,b){return new Date(b.fecha_solicitud)-new Date(a.fecha_solicitud);});
  if(pend.length===0){ html += '<div class="empty">Sin solicitudes pendientes.</div>'; }
  document.getElementById('main').innerHTML = html + '</div>';
  let extra = '';
  pend.forEach(function(r){
    extra += '<div class="card" data-sol="'+r.id+'"><div style="display:flex;justify-content:space-between;"><b>'+r.producto_asunto+'</b><span class="pill '+r.urgencia+'">'+r.urgencia+'</span></div>'+
      '<div style="font-size:12px;color:var(--ink-soft);margin:4px 0 8px;">'+storeName(r.tienda_id)+' · '+r.solicitante+'</div>'+
      (r.descripcion?'<div style="font-size:13px;margin-bottom:8px;">'+r.descripcion+'</div>':'')+
      '<textarea class="respInp" placeholder="Respuesta (opcional)"></textarea>'+
      '<div class="score-btns" style="margin-top:8px;"><button data-est="resuelta" class="sel5">Resolver</button><button data-est="rechazada" class="sel1">Rechazar</button></div></div>';
  });
  document.getElementById('main').insertAdjacentHTML('beforeend', extra);
  document.querySelectorAll('[data-sol]').forEach(function(card){
    card.querySelectorAll('.score-btns button').forEach(function(btn){
      btn.addEventListener('click', async function(){
        try{ await apiPost({action:'responder_solicitud', id:card.dataset.sol, estado:btn.dataset.est, respuesta:card.querySelector('.respInp').value}); cache.solicitudes=null; renderSolicitudesAdmin(); }
        catch(err){ alert('Error: '+err.message); }
      });
    });
  });
}
